<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand-row">
      <img class="logo" src="../icons/logo.svg" alt="" width="28" height="28" />
      <div>
        <div class="brand">Distill</div>
        <div class="subtitle">Google Meet capture</div>
      </div>
    </header>

    <section id="login-panel" class="panel hidden">
      <label>
        Email
        <input id="email" type="email" autocomplete="username" dir="ltr" />
      </label>
      <label>
        Password
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          dir="ltr"
        />
      </label>
      <button id="login-btn" class="primary" type="button">Sign in</button>
    </section>

    <section id="session-panel" class="panel hidden">
      <div class="row">
        <span id="user-label" class="muted" dir="ltr"></span>
        <button id="logout-btn" class="ghost" type="button">Sign out</button>
      </div>

      <div id="setup-block" class="stack">
        <label>
          Meeting title
          <input
            id="meeting-title"
            type="text"
            placeholder="Google Meet meeting"
          />
        </label>
        <button id="start-btn" class="primary" type="button">Start recording</button>
      </div>

      <div id="recording-block" class="stack hidden">
        <div class="status-card">
          <div><strong>Status</strong> <span>Recording</span></div>
          <div class="muted" id="progress-text"></div>
          <div class="muted" id="meeting-id" dir="ltr"></div>
          <div class="muted" id="streams-text"></div>
        </div>
        <button id="stop-btn" class="danger full" type="button">Stop</button>
      </div>

      <div id="done-block" class="stack hidden">
        <div class="status-card">
          <div><strong>Status</strong> <span>Finished</span></div>
          <div class="muted" id="done-progress"></div>
          <div class="muted" id="done-meeting-id" dir="ltr"></div>
        </div>
        <a
          id="open-meeting"
          class="primary link-btn"
          href="#"
          target="_blank"
          rel="noopener"
          >Open the meeting in Distill</a
        >
        <button id="new-capture-btn" class="ghost full" type="button">
          New recording
        </button>
      </div>

      <p id="hint" class="hint">
        Refresh the Meet tab, click the page, then press Start recording.
      </p>
    </section>

    <p id="error" class="error hidden"></p>
    <script src="popup.js"></script>
  </body>
</html>
