<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand-row">
      <img class="logo" src="../icons/logo.svg" alt="" width="40" height="19" />
      <div>
        <div class="brand">Distill</div>
        <div class="subtitle">ضبط گوگل میت</div>
      </div>
    </header>

    <section id="login-panel" class="panel hidden">
      <label>
        ایمیل
        <input id="email" type="email" autocomplete="username" dir="ltr" />
      </label>
      <label>
        رمز عبور
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          dir="ltr"
        />
      </label>
      <button id="login-btn" class="primary" type="button">ورود</button>
    </section>

    <section id="session-panel" class="panel hidden">
      <div class="row">
        <span id="user-label" class="muted" dir="ltr"></span>
        <button id="logout-btn" class="ghost" type="button">خروج</button>
      </div>

      <div id="setup-block" class="stack">
        <label>
          عنوان جلسه
          <input
            id="meeting-title"
            type="text"
            placeholder="جلسه گوگل میت"
          />
        </label>
        <button id="start-btn" class="primary" type="button">شروع ضبط</button>
      </div>

      <div id="recording-block" class="stack hidden">
        <div class="status-card">
          <div><strong>وضعیت</strong> <span>در حال ضبط</span></div>
          <div class="muted" id="progress-text"></div>
          <div class="muted" id="meeting-id" dir="ltr"></div>
          <div class="muted" id="streams-text"></div>
        </div>
        <button id="stop-btn" class="danger full" type="button">توقف</button>
      </div>

      <div id="done-block" class="stack hidden">
        <div class="status-card">
          <div><strong>وضعیت</strong> <span>پایان یافت</span></div>
          <div class="muted" id="done-progress"></div>
          <div class="muted" id="done-meeting-id" dir="ltr"></div>
        </div>
        <a
          id="open-meeting"
          class="primary link-btn"
          href="#"
          target="_blank"
          rel="noopener"
          >Open meeting in Distill</a
        >
        <button id="new-capture-btn" class="ghost full" type="button">
          ضبط جدید
        </button>
      </div>

      <p id="hint" class="hint">
        تب Meet را رفرش کنید، روی صفحه کلیک کنید، سپس شروع ضبط را بزنید.
      </p>
    </section>

    <p id="error" class="error hidden"></p>
    <script src="popup.js"></script>
  </body>
</html>
