# API container must reach runtime sidecars (STT/diarize/LLM). When the API runs
# in Docker, use service hostnames in root .env (see .env.example). Start runtime
# first: cd runtime && ./scripts/start.sh
services:
  distill:
    build: .
    image: distill:latest
    container_name: distill
    ports:
      - "127.0.0.1:${MEETING_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Paths are fixed in code under /app/data and /app/api/web
      MEETING_HOST: "0.0.0.0"
      MEETING_PORT: "8000"
      # HF_TOKEN comes from .env — required for pyannote (image includes CPU torch)
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      # Named volume survives image rebuild/redeploy: DB, uploads, audio,
      # STT cache, and HuggingFace/torch model caches under /app/data
      - distill-data:/app/data
    networks:
      - default
      - runtime
    restart: unless-stopped

networks:
  runtime:
    external: true
    name: runtime_default

volumes:
  distill-data:
