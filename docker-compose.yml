services:
  distill:
    build: .
    image: distill:latest
    container_name: distill
    ports:
      - "${MEETING_PORT:-8030}:8030"
    env_file:
      - .env
    environment:
      MEETING_HOST: "0.0.0.0"
      MEETING_PORT: "8030"
      MEETING_DB: /app/data/meetings.db
      MEETING_UPLOAD_DIR: /app/data/uploads
      MEETING_AUDIO_DIR: /app/data/audio
      MEETING_WEB_DIR: /app/api/web
      STT_CACHE_DIR: /app/data/stt_cache
    volumes:
      # Persists SQLite DB, uploads, live audio dumps, STT cache across restarts
      - distill-data:/app/data
    restart: unless-stopped

volumes:
  distill-data:
