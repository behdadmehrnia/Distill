services:
  distill:
    build: .
    image: distill:latest
    container_name: distill
    ports:
      - "${MEETING_PORT:-8030}:8030"
    env_file:
      - .env
    environment:
      # Paths are fixed in code under /app/data and /app/api/web
      MEETING_HOST: "0.0.0.0"
      MEETING_PORT: "8030"
    volumes:
      # Persists SQLite DB, uploads, live audio, STT cache
      - distill-data:/app/data
    restart: unless-stopped

volumes:
  distill-data:
