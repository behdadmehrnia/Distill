<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام — Distill</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page auth-page">
      <div class="auth-card">
        <a href="/" class="auth-brand">
          <img src="/logo.svg" alt="" width="36" height="36" />
          <span>Distill</span>
        </a>
        <h1 class="auth-title">ثبت‌نام</h1>
        <p class="auth-subtitle">حساب کاربری جدید بسازید</p>

        <form id="registerForm" class="auth-form">
          <label class="auth-label">
            نام نمایشی
            <input type="text" name="display_name" autocomplete="name" />
          </label>
          <label class="auth-label">
            ایمیل
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label class="auth-label">
            رمز عبور
            <input
              type="password"
              name="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>
          <p class="auth-hint">حداقل ۸ کاراکتر</p>
          <p id="registerError" class="auth-error" hidden></p>
          <button type="submit" class="btn btn-primary auth-submit">
            ایجاد حساب
          </button>
        </form>

        <p class="auth-footer">
          قبلاً ثبت‌نام کرده‌اید؟
          <a href="/login" id="loginLink">ورود</a>
        </p>
      </div>
    </main>
    <script src="/auth.js"></script>
    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/dashboard";
        document.getElementById("loginLink").href =
          "/login?next=" + encodeURIComponent(next);

        const existing = await distillAuth.me();
        if (existing) {
          window.location.href = next;
          return;
        }

        document
          .getElementById("registerForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const errEl = document.getElementById("registerError");
            errEl.hidden = true;
            const btn = form.querySelector("button[type=submit]");
            btn.disabled = true;
            try {
              await distillAuth.register(
                form.email.value,
                form.password.value,
                form.display_name.value
              );
              window.location.href = next;
            } catch (err) {
              errEl.textContent = err.message || "خطا در ثبت‌نام";
              errEl.hidden = false;
            } finally {
              btn.disabled = false;
            }
          });
      })();
    </script>
  </body>
</html>
