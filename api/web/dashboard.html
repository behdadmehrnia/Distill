<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جلسات من — Distill</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/dashboard" class="nav-brand">
        <svg
          width="42"
          height="20"
          viewBox="0 0 36 17"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M8.5 0.5C12.9183 0.5 16.5 4.08172 16.5 8.5C16.5 12.9183 12.9183 16.5 8.5 16.5C4.08172 16.5 0.5 12.9183 0.5 8.5C0.5 4.08172 4.08172 0.5 8.5 0.5Z"
            stroke="#FFC828"
          />
          <path
            d="M27.5 17C32.1944 17 36 13.1944 36 8.5C36 3.80558 32.1944 0 27.5 0C22.8056 0 19 3.80558 19 8.5C19 13.1944 22.8056 17 27.5 17Z"
            fill="#FFC828"
          />
        </svg>
        Distill
      </a>
      <div class="nav-meta">
        <div class="nav-user">
          <span id="userName" class="nav-user-name"></span>
          <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm">
            خروج
          </button>
        </div>
      </div>
    </nav>

    <main class="page dash-page">
      <div class="dash-toolbar">
        <div>
          <h1 class="dash-title">جلسات من</h1>
        </div>
        <button type="button" id="newMeetingBtn" class="btn btn-primary">
          جلسه جدید
        </button>
      </div>

      <div id="meetingsLoading" class="dash-loading">در حال بارگذاری…</div>
      <div id="meetingsEmpty" class="dash-empty" hidden>
        <div class="dash-empty-icon" aria-hidden="true">🎙️</div>
        <p>هنوز جلسه‌ای ندارید.</p>
        <button type="button" class="btn btn-primary" id="emptyNewBtn">
          اولین جلسه را بسازید
        </button>
      </div>
      <ul id="meetingsList" class="meeting-list" hidden></ul>
    </main>

    <script src="/auth.js"></script>
    <script src="/shared.js"></script>
    <script src="/meetings-list.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
