<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My meetings — Distill</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/dashboard" class="nav-brand">
        <svg
          width="26"
          height="26"
          viewBox="0 0 32 32"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M8 10h16" />
            <path d="M11 16h10" />
            <path d="M14 22h4" />
          </g>
          <circle cx="16" cy="26.5" r="1.6" fill="currentColor" />
        </svg>
        Distill
      </a>
      <div class="nav-meta">
        <div class="nav-user">
          <span id="userName" class="nav-user-name"></span>
          <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm">
            Sign out
          </button>
        </div>
      </div>
    </nav>

    <main class="page dash-page">
      <div class="dash-toolbar">
        <div>
          <h1 class="dash-title">My meetings</h1>
        </div>
        <button type="button" id="newMeetingBtn" class="btn btn-primary">
          New meeting
        </button>
      </div>

      <div id="meetingsLoading" class="dash-loading">Loading…</div>
      <div id="meetingsEmpty" class="dash-empty" hidden>
        <div class="dash-empty-icon" aria-hidden="true">🎙️</div>
        <p>No meetings yet.</p>
        <button type="button" class="btn btn-primary" id="emptyNewBtn">
          Record your first one
        </button>
      </div>
      <ul id="meetingsList" class="meeting-list" hidden></ul>
    </main>

    <script src="/auth.js"></script>
    <script src="/shared.js"></script>
    <script src="/meetings-list.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
