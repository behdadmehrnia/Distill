<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Distill</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page auth-page">
      <div class="auth-card">
        <a href="/" class="auth-brand">
          <img src="/logo.svg" alt="" width="32" height="32" />
          <span>Distill</span>
        </a>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Pick up where your meetings left off</p>

        <form id="loginForm" class="auth-form">
          <label class="auth-label">
            Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label class="auth-label">
            Password
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
            />
          </label>
          <p id="loginError" class="auth-error" hidden></p>
          <button type="submit" class="btn btn-primary auth-submit">
            Sign in
          </button>
        </form>

        <p class="auth-footer">
          No account yet?
          <a href="/register" id="registerLink">Create one</a>
        </p>
      </div>
    </main>
    <script src="/auth.js"></script>
    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/dashboard";
        document.getElementById("registerLink").href =
          "/register?next=" + encodeURIComponent(next);

        const existing = await distillAuth.me();
        if (existing) {
          window.location.href = next;
          return;
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const errEl = document.getElementById("loginError");
          errEl.hidden = true;
          const btn = form.querySelector("button[type=submit]");
          btn.disabled = true;
          try {
            await distillAuth.login(form.email.value, form.password.value);
            window.location.href = next;
          } catch (err) {
            errEl.textContent = err.message || "Could not sign in";
            errEl.hidden = false;
          } finally {
            btn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
