[project]
name = "distill"
version = "0.1.0"
description = "Record meetings and long audio, separate the speakers, and distil the transcript into decisions and action items."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Behdad Mehrnia" }]
keywords = ["meetings", "transcription", "diarization", "speech-to-text", "llm"]

[project.urls]
Homepage = "https://github.com/BMDarkLight/distill"
Repository = "https://github.com/BMDarkLight/distill"
Issues = "https://github.com/BMDarkLight/distill/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
